version: 2.1
jobs:
  build_test:
    docker:
      - image: circleci/node:12
    steps:
      - checkout
      - run:
          name: Install npm dependencies
          command: |
            npm install
  build_docker_image:
     docker:
       - image: circleci/node:12
     steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: false
      - run:
          name: Build Docker image
          command: |
            docker build -t nodejswebapp -t capostu3/nodejswebapp:latest .
            echo $DOCKER_PASSWORD | docker login -u capostu3 --password-stdin
            docker push capostu3/nodejswebapp:latest

workflows:
  build_test:
    jobs:
      - build_test
      - build_docker_image
      
